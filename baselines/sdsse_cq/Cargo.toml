[package]
name = "baseline-sdsse-cq"
description = "Faithful reimplementation of SDSSE-CQ and SDSSE-CQ-S (Zuo et al., PoPETs 2025) over Aura (Sun et al., NDSS 2021). A baseline, never part of the system under test."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
pqcl-dsse = { path = "../../crates/pqcl-dsse" }
pqcl-primitives = { path = "../../crates/pqcl-primitives" }

# The PRF `F` and `F_p`, keyed AES-256, are ODXT's: SDSSE-CQ evaluates against
# ODXT, and one PRF for both keeps the comparison about the schemes.
baseline-odxt = { path = "../odxt" }

# The cross-tags need a prime-order group; the same one as our ODXT port.
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }

# Aura's PRG and `SE` are AES (its section VI).
aes = "0.8"
rand = "0.8"

[lints]
workspace = true
