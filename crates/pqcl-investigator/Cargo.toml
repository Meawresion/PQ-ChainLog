[package]
name = "pqcl-investigator"
description = "M8b: the investigator's loopback custody dashboard and the Phase 1-11 midterm demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pqcl-primitives = { path = "../pqcl-primitives" }
pqcl-ggm = { path = "../pqcl-ggm" }
pqcl-dsse = { path = "../pqcl-dsse" }
pqcl-forest = { path = "../pqcl-forest" }
pqcl-capsule = { path = "../pqcl-capsule" }
pqcl-pipeline = { path = "../pqcl-pipeline" }
pqcl-warrant = { path = "../pqcl-warrant" }
# `Plane` only; the role traits and PKCS#11 are not needed by a client.
pqcl-sm = { path = "../pqcl-sm", default-features = false }
# The chain client Exp. 6 measured with, so the demo and the experiment cannot
# disagree about an encoding. Its secp256k1 signs transaction envelopes only.
pqcl-exp = { path = "../pqcl-exp", features = ["chain"] }
serde_json = "1"

[lints]
workspace = true
