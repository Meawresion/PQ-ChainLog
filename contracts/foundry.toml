[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]

# ⭐ These match `lib/ETHDILITHIUM`'s own default profile exactly — solc 0.8.30,
# optimizer on at 10 000 runs, `evm_version = "osaka"`, no via-IR.
#
# Not a coincidence and not a preference. Gas depends on every one of these, so
# building the verifier under different settings than its authors would make our
# measurement incomparable to their published 8.1 M / 4.9 M — and that
# comparison is the only external cross-check we have that the vendored copy
# behaves as advertised. If a setting has to change, change it deliberately and
# say so next to the number.
solc_version = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10000

# The nested libraries of the vendored submodule are not on our root `lib/`
# path, so they need explicit remappings.
remappings = [
    "forge-std/=lib/forge-std/src/",
    "sstore2/=lib/ETHDILITHIUM/lib/sstore2/contracts/",
    "InterfaceVerifier/=lib/ETHDILITHIUM/lib/InterfaceVerifier/src/",
]

# Read-only, and scoped to the fixtures directory rather than the whole tree.
# The ACVP control is a 1.1 MB JSON; inlining it into Solidity would be
# unreadable and would have to be regenerated by hand.
# ⚠️ Read is scoped to the fixtures; write is scoped to `out/` and nothing else.
#
# ⭐ The write exists because a gas figure in `console.log` cannot leave Foundry.
# `tab:exp6` needs the anchor's gas, `cargo xtask contracts` checks pass/fail and
# discards every number, and exp6's own record says `gas_measured_here: false` —
# so the paper asked for a quantity with no path from the tool that measures it.
# `out/` is already build output and already gitignored, so nothing a run writes
# there can dirty the tree and poison the next record's provenance.
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "write", path = "./out" },
]
