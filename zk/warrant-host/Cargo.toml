[package]
name = "warrant-host"
version = "0.1.0"
edition = "2021"
publish = false

# ⚠️ NOT a workspace member, and that is the whole design (chosen 2026-09-10).
#
# `sp1-sdk` pulls **608 transitive crates** and needs `protoc`, a system
# package. Inside the workspace, a machine without protoc would fail
# `cargo build --workspace` outright — including `pqcl-primitives` and every
# other crate that has nothing to do with proving. A fresh AWS instance, a new
# clone, or an artifact evaluator would hit a wall on unrelated code.
#
# Excluding it also keeps the workspace `Cargo.lock` free of those 608 entries,
# so there is no feature-unification path from the prover stack into the crates
# we take measurements with. Checked before deciding: sp1-sdk pulls neither
# `sha3` nor `aes-gcm`, so the two primitives we benchmark do not overlap at
# all; `digest 0.10.7` was the only shared crypto-adjacent dependency, and this
# removes even that.
#
# Same treatment `zk/warrant-guest` already gets, and for related reasons.
# ⛔ The cost is that `cargo xtask ci` does not reach this crate. That is paid
# for by `cargo xtask zk`, which builds the guest and runs these tests — a
# separate compilation unit, still actually executed. An excluded crate nobody
# runs is exactly the "skipped test reports green" failure this repo bans.

[dependencies]
# `default-features = false`, and only `blocking` added.
#
# ⚠️ This does NOT remove the pairing-based prover, and an earlier comment here
# claimed it did. `sp1-prover` depends on the FFI crate unconditionally, so it
# is linked whatever we do — measured with `cargo tree -i`, see
# `tests/stark_only.rs`. Keeping the feature set minimal is still worth doing;
# it just is not the guarantee.
#
# `blocking` because `ProverClient::from_env` is async in 6.x, and an async
# runtime in the test harness would buy nothing: proving is a long CPU-bound
# call, not a concurrency problem.
sp1-sdk = { version = "6.7.0", default-features = false, features = ["blocking"] }
pqcl-warrant = { path = "../../crates/pqcl-warrant" }
pqcl-primitives = { path = "../../crates/pqcl-primitives" }
pqcl-sm = { path = "../../crates/pqcl-sm", default-features = false }
# warrant-demo only: the saved vk (SP1 serialises proofs with bincode 1.3 too)
# and the bundle the dashboard reads.
bincode = "1.3.3"
serde_json = "1"

[dev-dependencies]
# ⭐ Only for barrier 4's negative test, which must CONSTRUCT a SNARK-wrapped
# proof to prove the verifier rejects it. `sp1-sdk` re-exports `SP1Proof` but
# not the two wrapper payload structs, so the test reaches them here.
#
# Pinned with `=` so the types unify with the ones inside sp1-sdk's own graph. A
# minor-version drift would give two distinct `Groth16Bn254Proof` types and the
# test would stop compiling for a reason unrelated to the property.
sp1-verifier = "=6.7.0"

[build-dependencies]
sp1-build = "6.7.0"

[workspace]
